<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaceGuard — Sign in</title>
<style>
:root{--bg:#070a12;--panel:#0e1422;--text:#f7f8fc;--muted:#8d98ad;--line:#252e42;--accent:#6d5dfc;--cyan:#22d3ee}
[data-theme=light]{--bg:#f4f7fb;--panel:#fff;--text:#101522;--muted:#667085;--line:#e0e5ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 20%,#6d5dfc2c,transparent 28%),radial-gradient(circle at 85% 80%,#22d3ee18,transparent 30%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;display:grid;place-items:center}.wrap{width:min(1050px,94vw);display:grid;grid-template-columns:1.1fr .9fr;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--panel);box-shadow:0 35px 100px #0006}.visual{padding:48px;background:linear-gradient(145deg,#6d5dfc20,#22d3ee09);position:relative}.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:grid;place-items:center}.visual h1{font-size:48px;line-height:1.02;margin:80px 0 16px}.visual p{color:var(--muted);line-height:1.7;max-width:440px}.orb{width:240px;height:240px;border:1px solid #22d3ee66;border-radius:50%;position:absolute;right:50px;bottom:50px;box-shadow:0 0 80px #6d5dfc22,inset 0 0 50px #22d3ee12}.orb:after{content:"";position:absolute;inset:42px;border:1px solid #6d5dfc77;border-radius:45%;animation:pulse 2s infinite}@keyframes pulse{50%{transform:scale(1.12);opacity:.5}}.form{padding:48px}.form h2{font-size:30px;margin:0 0 8px}.sub{color:var(--muted);margin-bottom:30px}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;font-weight:600}.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);outline:none}.field input:focus{border-color:var(--accent)}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),#8b7cff);color:white;font-weight:800;cursor:pointer;margin-top:10px}.switch{color:var(--muted);text-align:center;margin-top:20px}.switch a{color:#9d93ff;cursor:pointer}.msg{margin-top:14px;padding:11px;border-radius:10px;background:#ef444415;color:#fca5a5;display:none}.theme{position:fixed;top:20px;right:20px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px;cursor:pointer}@media(max-width:760px){.wrap{grid-template-columns:1fr}.visual{display:none}.form{padding:32px}}
</style></head><body><button class="theme" id="theme">☼</button>
<div class="wrap"><section class="visual"><div class="brand"><div class="logo">◎</div><b>FaceGuard</b></div><h1>Secure recognition.<br>Beautifully simple.</h1><p>Sign in to manage people, recognition sessions and attendance from one intelligent workspace.</p><div class="orb"></div></section>
<section class="form"><h2 id="title">Welcome back</h2><div class="sub" id="sub">Sign in to your FaceGuard workspace.</div><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="••••••••"></div><button class="btn" id="submit">Sign in →</button></form><div class="msg" id="msg"></div><div class="switch"><span id="switchText">New to FaceGuard?</span> <a id="switch">Create account</a></div></section></div>
<script>
let signup=false;const $=id=>document.getElementById(id);$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.theme=document.documentElement.dataset.theme};if(localStorage.theme)document.documentElement.dataset.theme=localStorage.theme;
$('switch').onclick=()=>{signup=!signup;$('title').textContent=signup?'Create your account':'Welcome back';$('sub').textContent=signup?'Set up your secure FaceGuard workspace.':'Sign in to your FaceGuard workspace.';$('submit').textContent=signup?'Create account →':'Sign in →';$('switchText').textContent=signup?'Already have an account?':'New to FaceGuard?';$('switch').textContent=signup?'Sign in':'Create account'};
$('form').onsubmit=async e=>{e.preventDefault();$('msg').style.display='none';try{const r=await fetch(signup?'/auth/signup':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||'Authentication failed');location.href='/'}catch(err){$('msg').textContent=err.message;$('msg').style.display='block'}};
</script></body></html>
